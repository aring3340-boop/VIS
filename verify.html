<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self' data: blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:">
<title>Certificate Verification · VIS</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="public-site">
<div class="verify-wrap">
  <nav class="navbar" style="background:transparent;backdrop-filter:none">
    <div class="container">
      <a class="brand" href="index.html"><img class="logo" src="assets/institute-logo.jpg" alt="Vocational Institute of Sulaimanyah seal"><span>Vocational Institute of Sulaimanyah</span></a>
      <div class="nav-cta" style="margin-inline-start:auto">
        <div class="lang-switch" id="lang-switch"></div>
        <button class="lang-btn theme-toggle" style="border-radius:8px" title="Theme">🌙</button>
      </div>
    </div>
  </nav>
  <div class="verify-main">
    <div class="verify-card">
      <div class="kicker">🏅</div>
      <h2 class="auth-title" data-i18n="verify_title" style="font-size:1.6rem"></h2>
      <p class="muted" style="margin-bottom:22px" data-i18n="verify_sub"></p>
      <form id="verify-form">
        <div class="field"><input id="v-code" class="input code-input" placeholder="VIS-XXXXXX" maxlength="12" required></div>
        <button class="btn btn-gold btn-block" data-i18n="verify_btn"></button>
      </form>
      <div class="verify-result" id="v-result"></div>
      <p style="margin-top:22px"><a href="index.html" class="muted" data-i18n="back_home"></a></p>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
