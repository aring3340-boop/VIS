<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel · VIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar" id="admin-sidebar">
    <a class="brand" href="index.html"><img class="logo" src="assets/institute-logo.jpg" alt="Vocational Institute of Sulaimanyah seal"><span style="color:#fff">VIS Panel</span></a>
    <a class="side-link" href="teacher.html" id="teacher-portal-link" style="display:none"><span class="ic">👩‍🏫</span><span data-i18n="teacher_portal"></span></a>
    <button class="side-link" data-tab="dash"><span class="ic">📊</span><span data-i18n="dash"></span></button>
    <button class="side-link" data-tab="students"><span class="ic">🎓</span><span data-i18n="students"></span></button>
    <button class="side-link" data-tab="attendance"><span class="ic">📅</span><span data-i18n="attendance_admin"></span></button>
    <button class="side-link" data-tab="ai"><span class="ic">✦</span><span data-i18n="ai_helper"></span></button>
    <button class="side-link" data-tab="schedule"><span class="ic">🗓️</span><span data-i18n="schedule"></span></button>
    <button class="side-link" data-tab="exam-results"><span class="ic">🧾</span><span data-i18n="exam_results"></span></button>
    <button class="side-link" data-tab="backup"><span class="ic">💾</span><span data-i18n="backup_restore"></span></button>
    <button class="side-link" data-tab="learning"><span class="ic">📝</span><span data-i18n="learning"></span></button>
    <button class="side-link" data-tab="resources" id="resources-tab"><span class="ic">📄</span><span data-i18n="resources_admin"></span></button>
    <button class="side-link" data-tab="msgs"><span class="ic">✉️</span><span data-i18n="msgs"></span></button>
    <button class="side-link" data-tab="certs"><span class="ic">🏅</span><span data-i18n="certs"></span></button>
    <button class="side-link" data-tab="website" id="website-tab"><span class="ic">🌐</span><span data-i18n="website_editor"></span></button>
    <button class="side-link" data-tab="staff" id="staff-tab"><span class="ic">🛡️</span><span data-i18n="staff_accounts"></span></button>
    <button class="side-link" data-tab="account"><span class="ic">⚙️</span><span data-i18n="account"></span></button>
    <div style="flex:1"></div>
    <a class="side-link" href="index.html" target="_blank"><span class="ic">🌐</span><span data-i18n="view_site"></span></a>
    <button class="side-link" id="btn-logout"><span class="ic">🚪</span><span data-i18n="logout"></span></button>
  </aside>
  <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Close navigation" tabindex="-1"></button>
  <main class="admin-main">
    <div class="admin-top">
      <button class="admin-menu-toggle" id="admin-menu-toggle" type="button" aria-controls="admin-sidebar" aria-expanded="false" aria-label="Open navigation menu">☰</button>
      <h2 id="page-title"></h2>
      <span class="tag" id="mode-badge" style="font-size:.72rem"></span>
      <button class="lang-btn theme-toggle" style="border-radius:8px" title="Theme">🌙</button>
      <div class="lang-switch" id="lang-switch"></div>
    </div>
    <div id="tab-content"></div>
  </main>
</div>
<div id="toast"></div>
<script src="js/supabase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/extended.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
