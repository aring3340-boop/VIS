<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self' data: blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:">
<meta name="description" content="Discover professional vocational programs, institute news and student resources at the Vocational Institute of Sulaimanyah.">
<meta property="og:type" content="website">
<meta property="og:title" content="Vocational Institute of Sulaimanyah">
<meta property="og:description" content="Discover professional vocational programs, institute news and student resources at the Vocational Institute of Sulaimanyah.">
<title>Vocational Institute of Sulaimanyah</title>
<link rel="icon" href="assets/institute-logo.jpg" type="image/jpeg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10243b">
<link rel="apple-touch-icon" href="assets/institute-logo.jpg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="public-site">

<nav class="navbar">
  <div class="container">
    <a class="brand" href="#top">
      <img class="logo" src="assets/institute-logo.jpg" alt="Vocational Institute of Sulaimanyah seal">
      <span id="site-name">Vocational Institute of Sulaimanyah</span>
    </a>
    <div class="nav-links" id="primary-navigation">
      <a href="#about" data-i18n="about"></a>
      <a href="#programs" data-i18n="programs"></a>
      <a href="#departments" data-i18n="department_details"></a>
      <a href="#timetable" data-i18n="weekly_timetable"></a>
      <a href="#events" data-i18n="events"></a>
      <a href="#gallery" data-i18n="gallery"></a>
      <a href="#news" data-i18n="news"></a>
      <a href="#contact" data-i18n="contact"></a>
      <a class="mobile-nav-login" href="login.html" data-i18n="login"></a>
    </div>
    <div class="nav-cta">
      <div class="lang-switch" id="lang-switch"></div>
      <button class="btn btn-ghost btn-sm" id="install-app" type="button" hidden data-i18n="install_app"></button>
      <button type="button" class="lang-btn theme-toggle" style="border-radius:8px" title="Theme" aria-label="Toggle color theme">🌙</button>
      <a class="btn btn-gold btn-sm" href="login.html" data-i18n="login"></a>
    </div>
    <button type="button" class="burger" id="burger" aria-label="Open navigation" aria-controls="primary-navigation" aria-expanded="false">☰</button>
  </div>
</nav>

<header class="hero" id="top">
  <div class="container">
    <div>
      <div class="kicker" data-i18n="hero_kicker" style="color:var(--gold2)"></div>
      <h1 id="hero-title"></h1>
      <p id="hero-sub"></p>
      <div class="hero-actions">
        <a class="btn btn-gold" href="login.html" data-i18n="cta_student"></a>
        <a class="btn btn-outline" href="login.html#staff" data-i18n="cta_staff"></a>
      </div>
    </div>
    <div class="hero-card">
      <div class="hero-seal"><img src="assets/institute-logo.jpg" alt="Vocational Institute of Sulaimanyah seal"></div>
      <h3 id="why-title"></h3>
      <ul>
        <li><span class="dot"></span><span id="why-1"></span></li>
        <li><span class="dot"></span><span id="why-2"></span></li>
        <li><span class="dot"></span><span id="why-3"></span></li>
        <li><span class="dot"></span><span id="why-4"></span></li>
      </ul>
    </div>
  </div>
</header>

<section class="stats">
  <div class="container stats-grid">
    <div class="stat"><b id="stat-programs">–</b><span data-i18n="stats_programs"></span></div>
    <div class="stat"><b id="stat-students">–</b><span data-i18n="stats_students"></span></div>
    <div class="stat"><b>30+</b><span data-i18n="stats_trainers"></span></div>
    <div class="stat"><b id="stat-since">–</b><span data-i18n="stats_since"></span></div>
  </div>
</section>

<section class="section alt" id="timetable">
  <div class="container">
    <div class="kicker" data-i18n="weekly_timetable"></div>
    <h2 class="section-title" data-i18n="weekly_timetable"></h2>
    <div class="table-wrap"><table><thead><tr><th data-i18n="day"></th><th data-i18n="dept"></th><th data-i18n="stage"></th><th data-i18n="course"></th><th data-i18n="time"></th><th data-i18n="room"></th></tr></thead><tbody id="public-timetable"></tbody></table></div>
  </div>
</section>

<section class="section" id="about">
  <div class="container">
    <div class="kicker" data-i18n="about"></div>
    <h2 class="section-title" data-i18n="about_title"></h2>
    <p class="lead" id="about-text"></p>
  </div>
</section>

<section class="section alt" id="programs">
  <div class="container">
    <div class="kicker" data-i18n="programs"></div>
    <h2 class="section-title" data-i18n="programs"></h2>
    <div class="grid-3" id="programs-grid" style="margin-top:34px"></div>
  </div>
</section>

<section class="section" id="departments">
  <div class="container">
    <div class="kicker" data-i18n="department_details"></div>
    <h2 class="section-title" data-i18n="department_details_title"></h2>
    <p class="lead" data-i18n="department_note"></p>
    <div class="grid-2 department-grid" id="department-grid"></div>
  </div>
</section>

<section class="section alt" id="faqs">
  <div class="container">
    <div class="kicker" data-i18n="faqs"></div>
    <h2 class="section-title" id="faq-title"></h2>
    <div class="faq-list">
      <details class="faq-item"><summary id="faq-q1"></summary><p id="faq-a1"></p></details>
      <details class="faq-item"><summary id="faq-q2"></summary><p id="faq-a2"></p></details>
      <details class="faq-item"><summary id="faq-q3"></summary><p id="faq-a3"></p></details>
      <details class="faq-item"><summary id="faq-q4"></summary><p id="faq-a4"></p></details>
    </div>
  </div>
</section>

<section class="section" id="events">
  <div class="container">
    <div class="kicker" data-i18n="events"></div>
    <h2 class="section-title" data-i18n="events_title"></h2>
    <div class="timeline" id="events-list"></div>
  </div>
</section>

<section class="section alt" id="gallery">
  <div class="container">
    <div class="kicker" data-i18n="gallery"></div>
    <h2 class="section-title" data-i18n="gallery"></h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</section>

<section class="section" id="news">
  <div class="container">
    <div class="kicker" data-i18n="news"></div>
    <h2 class="section-title" data-i18n="news_title"></h2>
    <div class="grid-3" id="news-grid" style="margin-top:34px"></div>
  </div>
</section>

<section class="section alt" id="contact">
  <div class="container">
    <div class="kicker" data-i18n="contact"></div>
    <h2 class="section-title" data-i18n="contact_title"></h2>
    <div class="contact-grid" style="margin-top:30px">
      <div>
        <p class="lead" data-i18n="contact_lead"></p>
      </div>
      <div class="card">
        <div class="info-item" id="office-hours-item" hidden><span class="ic">🕘</span><div><b data-i18n="office_hours"></b><p class="muted" id="c-office-hours"></p></div></div>
        <div class="info-item"><span class="ic">📍</span><div><b data-i18n="address"></b><p class="muted" id="c-address"></p></div></div>
        <div class="info-item"><span class="ic">📞</span><div><b data-i18n="phone"></b><p class="muted" id="c-phone"></p></div></div>
        <div class="info-item"><span class="ic">✉️</span><div><b data-i18n="email"></b><p class="muted" id="c-email"></p></div></div>
        <hr class="divider">
        <form id="contact-form">
          <div class="field"><input id="cf-name" class="input" data-i18n-ph="your_name" required></div>
          <div class="field"><input id="cf-email" type="email" class="input" data-i18n-ph="your_email" required></div>
          <div class="field"><input id="cf-phone" class="input" data-i18n-ph="your_phone"></div>
          <div class="field"><textarea id="cf-msg" class="input" data-i18n-ph="your_message" required></textarea></div>
          <button class="btn btn-gold btn-block" data-i18n="send"></button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="brand" style="margin-bottom:14px"><img class="logo" src="assets/institute-logo.jpg" alt=""><span id="site-name-f" style="color:#fff"></span></div>
        <p style="font-size:.9rem" id="footer-about"></p>
      </div>
      <div>
        <h4 data-i18n="footer_links"></h4>
        <p><a href="#about" data-i18n="about"></a></p>
        <p><a href="#programs" data-i18n="programs"></a></p>
        <p><a href="#departments" data-i18n="department_details"></a></p>
        <p><a href="#faqs" data-i18n="faqs"></a></p>
        <p><a href="#events" data-i18n="events"></a></p>
        <p><a href="#gallery" data-i18n="gallery"></a></p>
        <p><a href="verify.html" data-i18n="verify"></a></p>
        <p><a href="login.html" data-i18n="login"></a></p>
      </div>
      <div>
        <h4 data-i18n="footer_contact"></h4>
        <p style="font-size:.9rem" id="f-address"></p>
        <p style="font-size:.9rem" id="f-phone"></p>
        <p style="font-size:.9rem" id="f-email"></p>
      </div>
    </div>
    <div class="footer-bottom">© <span id="year"></span> <span id="site-name-b"></span> · VIS</div>
  </div>
</footer>

<div id="toast"></div>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/extended.js"></script>
<script src="js/public.js"></script>
<script>
mountLangSwitch('lang-switch');
mountThemeToggle('.theme-toggle');
const nav=document.querySelector('.navbar');
const menuButton=document.getElementById('burger');
function closeNavigation(){nav.classList.remove('open');menuButton.setAttribute('aria-expanded','false');menuButton.setAttribute('aria-label','Open navigation');}
menuButton.onclick=()=>{
  const open=nav.classList.toggle('open');
  menuButton.setAttribute('aria-expanded',String(open));
  menuButton.setAttribute('aria-label',open?'Close navigation':'Open navigation');
};
document.querySelectorAll('.nav-links a').forEach(a=>a.onclick=closeNavigation);
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeNavigation();});
const _origRender=renderPublic;
renderPublic=function(){_origRender();
  const s=Store.data.settings;
  setText('site-name-f',pick({en:s.siteName_en,ku:s.siteName_ku}));
  setText('site-name-b',pick({en:s.siteName_en,ku:s.siteName_ku}));
  setText('f-address',pick({en:s.address_en,ku:s.address_ku}));
  setText('f-phone',s.phone);setText('f-email',s.email);
};
boot(renderPublic);
</script>
<script src="js/pwa.js"></script>
</body>
</html>
